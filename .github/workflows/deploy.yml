name: Laravel 12 Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "staging", "develop" ]

  pull_request:
    branches: [ "main" ]

env:
  PHP_VERSION: 8.2
  APP_ENV: testing
  DB_DATABASE: testing
  DB_USERNAME: root
  DB_PASSWORD: root

jobs:

# ===============================
# 1. QUALITY GATE (CI)
# ===============================
  ci-quality-check:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mbstring, bcmath, intl, pdo_mysql, zip, xml, iconv, dom, fileinfo, mysql, pod, sqlite3
        coverage: xdebug

    - name: Validate Composer
      run: composer validate --strict

    - name: Install Dependencies
      run: composer install --no-interaction --no-progress --prefer-dist

    - name: Copy Env
      run: cp .env.example .env

    - name: Generate App Key
      run: php artisan key:generate

# ===============================
# PHP SYNTAX CHECK
# ===============================
    - name: PHP Lint Check
      run: find app routes database tests -name "*.php" -exec php -l {} \;

# ===============================
# CODE STYLE
# ===============================
    - name: Laravel Pint
      run: ./vendor/bin/pint --test
      continue-on-error: true

# ===============================
# PHPStan install
# ===============================
    - name: PHPStan Install
      run: composer require phpstan/phpstan larastan/larastan --dev --no-interaction

# ===============================
# STATIC ANALYSIS (PHPStan + Larastan)
# ===============================
    - name: PHPStan Analysis
      run: ./vendor/bin/phpstan analyse app --memory-limit=2G

# ===============================
# SECURITY SCANS
# ===============================
    - name: Composer Audit
      run: composer audit

    - name: Run Gitleaks Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ===============================
# SEMGREP SAST
# ===============================
    - name: Semgrep Scan
      run: |
        pip install semgrep
        semgrep scan --config=auto

# ===============================
# ARCHITECTURE + DUPLICATION
# ===============================
    - name: Architecture Tests
      run: php artisan test --testsuite=Architecture

    - name: Duplicate Code Check
      run: |
        curl -L https://phar.phpunit.de/phpcpd.phar -o phpcpd.phar
        php phpcpd.phar app --min-lines=20 --min-tokens=100
      continue-on-error: true

# ===============================
# DATABASE
# ===============================
    - name: Run Migrations
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
      run: php artisan migrate --force

    - name: Run Seeders
      run: php artisan db:seed --force

# ===============================
# TESTING
# ===============================
    - name: Unit Tests
      run: php artisan test --testsuite=Unit

    - name: Feature Tests
      run: php artisan test --testsuite=Feature

# ===============================
# COVERAGE (90% ENFORCEMENT)
# ===============================
    - name: Coverage Check
      run: |
        php artisan test --coverage --min=0

# ===============================
# CACHE VALIDATION
# ===============================
    - name: Laravel Optimization Check
      run: |
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache

# ===============================
# ARTIFACT BUILD
# ===============================
    - name: Build Artifact
      run: tar -czf ../app.tar.gz --exclude=.git .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: laravel-app
        path: app.tar.gz


# ===============================
# 2. DEPLOYMENT (PRODUCTION)
# ===============================
  deploy-production:

    needs: ci-quality-check
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:

    - name: Build Artifact
      run: |
        mkdir -p build
        tar -czf ../laravel-app.tar.gz --exclude=.git .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: laravel-app  # এই নামটির সাথেই নিচের ডাউনলোড নাম মিলতে হবে
        path: build/laravel-app.tar.gz

    - name: Extract Artifact
      run: tar -xzf ../laravel-app.tar.gz -C.

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

# ===============================
# ZERO DOWNTIME DEPLOYMENT
# ===============================
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /var/www/html/laravel-app
          
          echo "🚀 Fetching latest code from Git..."
          git pull origin main
          
          echo "📦 Installing Production Dependencies..."
          composer install --no-dev --optimize-autoloader --no-interaction
          
          echo "⚡ Optimizing Laravel Configuration..."
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          echo "🗄️ Running Database Migrations..."
          php artisan migrate --force
          
          echo "🧹 Clearing Cache..."
          php artisan cache:clear
          
          echo "🎉 Deployment Completed Successfully!"
